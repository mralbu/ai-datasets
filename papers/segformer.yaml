title: "SegFormer: Simple and Efficient Design for Semantic Segmentation with Transformers"
short: SegFormer
year: 2021
venue: NeurIPS 2021
authors: Enze Xie, Wenhai Wang, Zhiding Yu, Anima Anandkumar, Jose M. Alvarez, Ping Luo
category: vision
arxiv: "2105.15203"
one_liner: Paired a hierarchical, position-free Vision Transformer encoder with a tiny all-MLP decoder.
idea: >-
  Replace ViT's single-scale patch grid and fixed positional encodings with Mix Transformer (MiT),
  a four-stage pyramid that mixes overlapping patch embeddings with lightweight 3×3 depthwise
  convolutions inside each feed-forward block—so it adapts cleanly to any test resolution. Because
  self-attention already sees far across the image, a small all-MLP head suffices to fuse the four
  stages and predict masks.
result: >-
  50.3% mIoU on ADE20K val with SegFormer-B4 (64M parameters, 5× smaller than earlier Transformer
  baselines) and 51.8% with B5, plus 84.0% mIoU on Cityscapes val.
why: >-
  Early Vision Transformer segmenters like SETR were heavy, slow, and broke whenever test images
  changed resolution because their positional embeddings had to be interpolated. SegFormer showed
  that a clean multi-scale Transformer needs almost no decoder at all, setting the practical
  template for Transformer semantic segmentation.
datasets: [ade20k, cityscapes]
builds_on: [vit, deeplabv3-plus, fcn]
