name: UC Merced Land Use
year: 2010
modality: vision
tags: [remote-sensing]
task: Aerial scene classification
one_liner: 2,100 aerial photos of US cities at 30 cm per pixel, in 21 land-use classes.
creators: Yi Yang, Shawn Newsam (University of California, Merced)
size: 2,100 images (100 per class)
splits: { all: 2100 }
input: 256×256 color aerial photo, about 30 cm per pixel (77 × 77 m)
labels: One of 21 classes, from agricultural and airplane to storage tanks and tennis court
license: Public domain imagery (USGS National Map); no explicit license for the dataset
paper:
  title: Bag-Of-Visual-Words and Spatial Extensions for Land-Use Classification
  url: https://faculty.ucmerced.edu/snewsam/papers/Yang_ACMGIS10_BagOfVisualWords.pdf
homepage: http://weegee.vision.ucmerced.edu/datasets/landuse.html
why: >-
  The first widely used benchmark for classifying aerial scenes, made when
  the best methods were bags of visual words. Its tiles are sharp enough to
  see cars, tennis court lines and airplane wings, unlike satellite sets such
  as EuroSAT where a pixel covers 10 m. When CNN features pretrained on
  ImageNet pushed accuracy to near 99% around 2015, it became the standard
  demonstration that ImageNet features transfer to remote sensing, and the
  field moved to larger sets like AID and NWPU-RESISC45.
trivia:
  - The images were cut by hand from the USGS National Map Urban Area Imagery of 20 US regions.
  - With only 100 images per class, results are reported as averages over several random train/test splits.
  - Dense, medium and sparse residential are three separate classes, and the hardest to tell apart.
lineage:
  - { name: EuroSAT, note: "2017, 64×64 Sentinel-2 satellite tiles at 10 m per pixel", hf: timm/eurosat-rgb, id: eurosat }
  - { name: AID, note: "2017, 10,000 aerial images in 30 classes", url: "https://captain-whu.github.io/AID/" }
  - { name: NWPU-RESISC45, note: "2017, 31,500 images in 45 classes", url: "https://arxiv.org/abs/1703.00121" }
  - { name: ImageNet, note: "2009, whose features made the benchmark easy", hf: ILSVRC/imagenet-1k, id: imagenet }
landmark_papers:
  - { title: "Do Deep Features Generalize from Everyday Objects to Remote Sensing and Aerial Scenes Domains?", year: 2015, url: "https://arxiv.org/abs/1508.00092" }
  - { title: "AID: A Benchmark Data Set for Performance Evaluation of Aerial Scene Classification", year: 2017, url: "https://arxiv.org/abs/1608.05167" }
source: { hf: blanchon/UC_Merced, config: default, split: train, n: 84, seed: 3, rows_per_page: 1, page: 25 }
display: { kind: image, image: image, label: label, scale: 0.6, class_grid: true }
