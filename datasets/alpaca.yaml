name: Alpaca
year: 2023
modality: benchmark
task: Instruction tuning data (instruction → response)
one_liner: 52,000 instructions and answers, generated by GPT-3.5 for about $500.
creators: Rohan Taori, Ishaan Gulrajani, Tianyi Zhang, Yann Dubois, Xuechen Li, Carlos Guestrin, Percy Liang, Tatsunori B. Hashimoto (Stanford)
size: 52,002 examples
splits: { train: 52002 }
input: An instruction, sometimes with an input to work on
labels: A response written by text-davinci-003
license: CC BY-NC 4.0
paper:
  title: "Alpaca: A Strong, Replicable Instruction-Following Model"
  url: https://crfm.stanford.edu/2023/03/13/alpaca.html
homepage: https://github.com/tatsu-lab/stanford_alpaca
why: >-
  Weeks after Meta's LLaMA weights appeared, Stanford fine-tuned the 7B model
  on these 52k examples and got a chatbot that felt close to OpenAI's at the
  time, for a few hundred dollars. That kicked off the wave of open
  instruction-tuned models (Vicuna, Koala, Dolly and many more), and the
  Alpaca prompt format became a common template.
trivia:
  - The data was made with the Self-Instruct method, starting from 175 human-written seed tasks and asking the model to invent more.
  - Because it was generated by an OpenAI model under OpenAI's terms, it is licensed for non-commercial use only.
  - It has many errors, such as wrong math and hallucinated facts, which led to community-cleaned versions.
lineage:
  - { name: IFEval, note: "2023, instruction following checked by code", hf: google/IFEval, id: ifeval }
  - { name: Self-Instruct, note: "2022, the generation method", url: "https://github.com/yizhongw/self-instruct" }
  - { name: Dolly 15k, note: "2023, human-written and commercially usable", hf: databricks/databricks-dolly-15k }
  - { name: Anthropic HH-RLHF, note: "2022, preference data for the RLHF step", hf: Anthropic/hh-rlhf, id: hh-rlhf }
landmark_papers:
  - { title: "Vicuna: An Open-Source Chatbot Impressing GPT-4", year: 2023, url: "https://lmsys.org/blog/2023-03-30-vicuna/" }
  - { title: "LIMA: Less Is More for Alignment", year: 2023, url: "https://arxiv.org/abs/2305.11206" }
source: { hf: tatsu-lab/alpaca, config: default, split: train, n: 12, seed: 34 }
display: { kind: qa, question: instruction, input: input, answer: output, answer_label: Show response }
