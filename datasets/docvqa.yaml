  - { name: InfographicVQA, note: "2021, companion benchmark over tall, visually dense infographics", url: "https://arxiv.org/abs/2104.12756" }
  - { name: ChartQA, note: "2022, visual and arithmetic reasoning over plots and charts", hf: HuggingFaceM4/ChartQA, id: chartqa }
  - { name: MP-DocVQA, note: "2023, multi-page extension requiring cross-page lookup", url: "https://arxiv.org/abs/2212.05935" }
  - { name: MMMU, note: "2023, college-level multimodal reasoning", hf: MMMU/MMMU, id: mmmu }
landmark_papers:
  - { title: "OCR-free Document Understanding Transformer (Donut)", year: 2022, url: "https://arxiv.org/abs/2111.15664" }
source:
  hf: HuggingFaceM4/DocumentVQA
  config: default
  split: validation
  n: 18
  seed: 17
  rows_per_page: 2
  page: 20
  max_image_px: 900
display: { kind: vqa, image: image, question: question, answers: answers, type: question_types, fit: contain, consensus: false }
download:
