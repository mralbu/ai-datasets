name: CIFAR-10
year: 2009
modality: vision
task: Image classification (10 everyday classes)
one_liner: 60,000 tiny 32×32 color images in 10 classes.
creators: Alex Krizhevsky, Vinod Nair, Geoffrey Hinton
size: 60,000 images (6,000 per class)
splits: { train: 50000, test: 10000 }
input: 32×32 RGB image
labels: airplane, automobile, bird, cat, deer, dog, frog, horse, ship, truck
license: No formal license (free for research)
paper:
  title: Learning Multiple Layers of Features from Tiny Images
  url: https://www.cs.toronto.edu/~kriz/learning-features-2009-TR.pdf
homepage: https://www.cs.toronto.edu/~kriz/cifar.html
why: >-
  The step up from MNIST: real photos, in color, but still tiny enough to train
  on in minutes. It became the standard testbed for new architectures and
  training tricks (ResNets were first stress-tested on it), and it is still
  the default "does my idea work at all?" benchmark.
trivia:
  - At 32×32 pixels, even people find some images hard to classify. Toggle "Actual pixel size" to see how small they are.
  - 'Classes are mutually exclusive by design: "automobile" and "truck" never overlap, and pickup trucks are in neither.'
  - It is a hand-labeled subset of the 80 Million Tiny Images collection, which was withdrawn in 2020 over offensive labels. CIFAR's own labels were checked by hand and are unaffected.
  - CIFAR-10.1 (2018) built a new test set the same way, and accuracy dropped by about 4–10 points. The authors found this was not overfitting to the test set but brittleness to a small shift in the data.
lineage:
  - { name: CIFAR-100, note: "2009, same images style, 100 fine-grained classes", hf: uoft-cs/cifar100 }
  - { name: CIFAR-10.1, note: "2018, fresh test set", url: "https://github.com/modestyachts/CIFAR-10.1" }
  - { name: CINIC-10, note: "2018, CIFAR plus downsampled ImageNet", hf: flwrlabs/cinic10 }
  - { name: SVHN, note: "2011, real-world house-number digits at the same 32×32 size", hf: ufldl-stanford/svhn, id: svhn }
landmark_papers:
  - { title: "Deep Residual Learning for Image Recognition (ResNet)", year: 2015, url: "https://arxiv.org/abs/1512.03385" }
  - { title: "Do CIFAR-10 Classifiers Generalize to CIFAR-10?", year: 2018, url: "https://arxiv.org/abs/1806.00451" }
source: { hf: uoft-cs/cifar10, config: plain_text, split: test, n: 60, seed: 2 }
display: { kind: image, image: img, label: label, scale: 3, class_grid: true }
