name: PASCAL VOC
year: 2005
modality: vision
task: Object detection, segmentation and classification
one_liner: The 20-class object-detection challenge that ran every year from 2005 to 2012.
creators: Mark Everingham, Luc Van Gool, Chris Williams, John Winn, Andrew Zisserman
size: 11,540 images with 27,450 labeled objects (VOC2012 detection train + val)
splits: { train: 5717, val: 5823 }
input: RGB photo from Flickr, typically 500 px on the long side
labels: Boxes for 20 classes (person, animals, vehicles, household objects)
license: Annotations for research use; images under their Flickr licenses
paper:
  title: The PASCAL Visual Object Classes (VOC) Challenge
  url: https://doi.org/10.1007/s11263-009-0275-4
homepage: http://host.robots.ox.ac.uk/pascal/VOC/
why: >-
  Before COCO, "detection" meant VOC. Its evaluation, a box counts if it
  overlaps the truth by at least 50% (IoU ≥ 0.5) and classes are scored by
  average precision, is still reported today as AP50. Deformable part models
  dominated it for years; then R-CNN (2014) used ImageNet-pretrained CNN
  features to reach 53.3% mAP on VOC2012, a jump that moved detection over to
  deep learning.
trivia:
  - "The 20 classes: person; bird, cat, cow, dog, horse, sheep; aeroplane, bicycle, boat, bus, car, motorbike, train; bottle, chair, dining table, potted plant, sofa, tv/monitor."
  - Objects marked "difficult" are ignored in scoring, so a model is not penalized for missing them.
  - The VOC2007 test labels were released, so "VOC07 test" stayed a standard benchmark for years after the challenge ended. Later test sets were kept private.
  - The original annotations are XML files with corner coordinates (xmin, ymin, xmax, ymax). This copy uses COCO-style [x, y, width, height].
  - The challenge ended in 2012. Mark Everingham, who led it, died that year.
lineage:
  - { name: MS COCO, note: "2014, 80 classes in cluttered scenes, the successor", hf: rafaelpadilla/coco2017, id: coco }
  - { name: ImageNet (ILSVRC), note: "2010–2017, ran its own detection track from 2013", id: imagenet, url: "https://www.image-net.org/challenges/LSVRC/" }
landmark_papers:
  - { title: "Object Detection with Discriminatively Trained Part-Based Models (DPM)", year: 2010, url: "https://doi.org/10.1109/TPAMI.2009.167" }
  - { title: "Rich Feature Hierarchies for Accurate Object Detection (R-CNN)", year: 2014, url: "https://arxiv.org/abs/1311.2524" }
  - { title: "SSD: Single Shot MultiBox Detector", year: 2016, url: "https://arxiv.org/abs/1512.02325" }
source: { hf: TNILab/pascal_voc2012_det_train_val, config: default, split: validation, n: 18, seed: 18 }
display: { kind: boxes, image: image, objects: objects, label: category }
download:
  note: "A community Parquet copy of the VOC2012 detection train/val set (~400 MB). The originals, with segmentation masks and VOC2007, are on the official site."
