name: VQA v2
year: 2017
modality: vision
task: Visual question answering
one_liner: 1.1 million questions about COCO photos, each answered by ten people.
creators: Yash Goyal, Tejas Khot, Douglas Summers-Stay, Dhruv Batra, Devi Parikh (Virginia Tech, Army Research Laboratory, Georgia Tech)
size: 204,721 images, 1.1 million questions, 11 million answers
splits: { train: 443757, validation: 214354, test: 447793 }
input: A COCO photo and an open-ended question about it
labels: Ten free-form answers per question, typed as yes/no, number or other
license: CC BY 4.0 (annotations); images under COCO's Flickr terms
paper:
  title: "Making the V in VQA Matter: Elevating the Role of Image Understanding in Visual Question Answering"
  url: https://arxiv.org/abs/1612.00837
homepage: https://visualqa.org/
why: >-
  The first VQA dataset (2015) asked people to write questions about a photo
  that a smart robot could not answer without seeing it. Models soon did well
  anyway, partly without looking: "what color is the banana?" is usually
  yellow, and "is there a…?" is usually yes. Version 2 fixed this by pairing
  each question with a similar image that has a different answer, so language
  priors alone stop working. It became the standard test of vision-language
  models for years, from bottom-up attention and ViLBERT to Flamingo and the
  first multimodal LLMs.
trivia:
  - A model's answer gets full credit if at least three of the ten people gave it, and a third of the credit per person otherwise. That is the percentage shown with each answer.
  - About 38% of questions are yes/no, 12% are about numbers, and the rest are "other".
  - Many questions have no single right answer. Ten people often disagree on counting, colors and how much detail to give.
  - The images are COCO's, so VQA, COCO captions and Visual Genome often describe the same photos.
