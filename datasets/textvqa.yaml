  - { name: ST-VQA, note: "2019, concurrent scene-text VQA benchmark scored with ANLS", url: "https://rrc.cvc.uab.es/?ch=11" }
  - { name: DocVQA, note: "2020, reading scanned documents, forms and tables", hf: HuggingFaceM4/DocumentVQA, id: docvqa }
  - { name: ChartQA, note: "2022, reading and reasoning over real-world charts", hf: HuggingFaceM4/ChartQA, id: chartqa }
  - { name: MMMU, note: "2023, college-level multimodal reasoning", hf: MMMU/MMMU, id: mmmu }
landmark_papers:
  - { title: "Iterative Answer Prediction with Pointer-Augmented Multimodal Transformers for TextVQA (M4C)", year: 2020, url: "https://arxiv.org/abs/1911.06258" }
source:
  hf: lmms-lab-encoder/textvqa
  config: default
  split: validation
  n: 18
  seed: 29
  rows_per_page: 2
  page: 20
