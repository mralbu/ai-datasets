name: MS COCO
year: 2014
modality: vision
task: Object detection, segmentation and captioning
one_liner: 330k everyday scenes with 1.5M labeled objects in 80 categories.
creators: Tsung-Yi Lin et al. (Microsoft and academic partners)
size: ~330k images, ~200k annotated
splits: { train2017: 118287, val2017: 5000, test2017: 40670 }
input: RGB photo, typically 640 px on the long side
labels: Boxes and masks for 80 object categories, 5 captions per image
license: Annotations CC BY 4.0; images under their Flickr licenses
paper:
  title: "Microsoft COCO: Common Objects in Context"
  url: https://arxiv.org/abs/1405.0312
homepage: https://cocodataset.org/
why: >-
  ImageNet asks "what is in this photo?"; COCO asks "where is every object?".
  Its cluttered, non-iconic scenes and its box AP metric became the yardstick
  for object detection (Faster R-CNN, YOLO, Mask R-CNN, DETR), and its captions
  helped start image captioning and vision-language models.
trivia:
  - Boxes are stored as [x, y, width, height] in pixels, from the top-left corner. Many bugs come from assuming [x1, y1, x2, y2].
  - The label list has 91 slots but only 80 are used; ids like "street sign" and "hat" were dropped, which is why category ids have gaps.
  - The standard metric averages precision over IoU thresholds from 0.5 to 0.95, which rewards tight boxes.
  - About 1 in 10 annotations is a "crowd" region (a group of people or objects) handled specially in scoring.
lineage:
  - { name: Pascal VOC, note: "2005–2012, 20 classes, the predecessor", hf: TNILab/pascal_voc2012_det_train_val, id: pascal-voc }
  - { name: ADE20K, note: "2017, every pixel labeled, 150-class benchmark", hf: 1aurent/ADE20K, id: ade20k }
  - { name: Flickr30k, note: "2014, 31k captioned photos, the captioning benchmark before COCO Captions", hf: nlphuji/flickr30k, id: flickr30k }
  - { name: LVIS, note: "2019, 1,200+ categories on COCO images", url: "https://www.lvisdataset.org/" }
  - { name: Objects365, note: "2019, 365 categories, 638k images at release", url: "https://www.objects365.org/" }
  - { name: Visual Genome, note: "2016, scene graphs on about half of COCO's images", hf: ljnlonoljpiljm/visual_genome, id: visual-genome }
  - { name: VQA v2, note: "2017, 1.1 million questions about COCO images", hf: lmms-lab-encoder/VQAv2, id: vqa-v2 }
landmark_papers:
