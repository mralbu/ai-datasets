name: Palmer Penguins
year: 2020
modality: tabular
task: Multiclass classification (penguin species)
one_liner: 344 penguins from three Antarctic islands, with bill, flipper and body-mass measurements.
creators: Allison Horst, Alison Hill, Kristen Gorman (data from Palmer Station LTER)
size: 344 rows × 8 columns
splits: { all: 344 }
input: Island, bill length and depth (mm), flipper length (mm), body mass (g), sex, year
labels: Adélie (152), Gentoo (124), Chinstrap (68)
license: CC0 1.0
paper:
  title: Ecological Sexual Dimorphism and Environmental Variability within a Community of Antarctic Penguins (Genus Pygoscelis)
  url: https://doi.org/10.1371/journal.pone.0090081
homepage: https://allisonhorst.github.io/palmerpenguins/
why: >-
  Released as an R package to replace Iris in teaching. It is just as
  small, but with real-world mess: missing values, categorical columns
  (island, sex) and unequal classes. It also has no tie to Iris's eugenics
  history. It shows Simpson's paradox: across all penguins, longer bills go
  with shallower bills, but within each species the relation is
  positive. Plot it and the species separate cleanly.
trivia:
  - The measurements were taken from 2007 to 2009 by Dr. Kristen Gorman at Palmer Station, Antarctica.
  - Two penguins have no measurements at all and 11 have no recorded sex, so imputation or dropping rows is part of the exercise.
  - "Gentoo penguins are much heavier (about 5 kg on average) than Adélie and Chinstrap (about 3.7 kg)."
  - The package's penguin illustrations by Allison Horst helped it spread quickly in data-science courses.
lineage:
  - { name: Iris, note: "1936, the dataset it replaces in teaching", hf: scikit-learn/iris, id: iris }
landmark_papers: []
source: { hf: SIH/palmer-penguins, config: default, split: train, n: 12, seed: 26, fetch_all: true }
display:
  kind: table
  chart: { x: bill_length_mm, y: bill_depth_mm, color: species, title: "All 344 penguins: bill length vs depth (Simpson's paradox)" }
