name: Check dataset sources

# Monthly: confirm every Hugging Face source still serves rows (one tiny request
# each). Fails, and so emails the repo owner, if a dataset was renamed, gated or
# deleted. The site is unaffected either way: it keeps the snapshot.

on:
  schedule:
    - cron: '23 5 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run scripts/sample.py --check
